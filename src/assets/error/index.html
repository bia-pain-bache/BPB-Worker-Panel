<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BPB Panel v__VERSION__</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="data:image/x-icon;base64,__ICON__">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --color-bg-main: radial-gradient(circle at 20% 20%, rgba(239, 68, 68, 0.15) 0%, transparent 40%),
                             radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                             linear-gradient(135deg, #020617 0%, #150912 50%, #030712 100%);
            --color-text-primary: #f8fafc;
            --color-text-secondary: #cbd5e1;
            --color-brand-hover: #60a5fa;
            --color-border-accent: rgba(239, 68, 68, 0.25);
            --shadow-header: 0 2px 10px rgba(0, 0, 0, 0.5);
            --space-sm: 0.5rem;
            --radius-card: 1.5rem;
        }

        body,
        html {
            height: 100%;
            width: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Twemoji Country Flags", "Ubuntu", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--color-text-secondary);
            background: var(--color-bg-main);
            text-align: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #error-container {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--color-border-accent);
            border-radius: var(--radius-card);
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(239, 68, 68, 0.15);
            max-width: 90%;
            width: 480px;
            animation: errorPop 0.45s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
        }

        @keyframes errorPop {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        h1 {
            color: var(--color-text-primary);
            text-shadow: var(--shadow-header);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--space-sm);
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0 0 1.5rem 0;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        #header-logo {
            filter: drop-shadow(0 4px 12px rgba(239, 68, 68, 0.35));
        }

        .panel-version {
            align-self: flex-start;
            font-size: 0.85rem;
            font-weight: 600;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(99, 102, 241, 0.2));
            border: 1px solid var(--color-border-accent);
            padding: 2px 8px;
            border-radius: 9999px;
            color: var(--color-brand-hover);
        }

        h2 {
            color: #f87171;
            font-size: 1.3rem;
            margin: 1rem 0 0.5rem 0;
        }

        p {
            margin: 0.5rem 0 0 0;
            line-height: 1.5;
            color: var(--color-text-secondary);
            font-size: 0.95rem;
            word-break: break-word;
        }
    </style>
</head>

<body>
    <div id="error-container">
        <div class="header">
            <img id="header-logo" src="data:image/x-icon;base64,__ICON__" alt="BPB Logo" width="48" height="48">
            <h1>
                BPB Panel
                <span class="panel-version">
                    v__VERSION__
                </span>
            </h1>
        </div>

        <div>
            <h2>❌ Something went wrong!</h2>
            <p>
                <b>__ERROR_MESSAGE__</b>
            </p>
        </div>
    </div>

</body>

</html>
